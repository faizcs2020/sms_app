name: sms_gateway_app
description: "Production-ready Flutter Android SMS Gateway client application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  http: ^1.3.0
  permission_handler: ^11.4.0
  device_info_plus: ^11.3.0
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.3
  intl: ^0.20.2
  provider: ^6.1.2
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
